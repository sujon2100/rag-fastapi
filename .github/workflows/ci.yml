name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU-only torch wheel first; the default PyPI wheel pulls in CUDA libs we don't need
      - run: pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (no network, no secrets)
        run: pytest tests -q --cov=app --cov=evals --cov-report=term-missing

  retrieval-gate:
    # Retriever-only eval against the eval-v1 namespace: no LLM, ~1 minute.
    # Skips itself when the PINECONE_API_KEY secret is not set (e.g. on forks).
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check secret
        id: secret
        run: echo "present=$([ -n "$PINECONE_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.secret.outputs.present == 'true'
        run: |
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - if: steps.secret.outputs.present == 'true'
        run: python -m evals.run_eval --phase retrieval --gate evals/thresholds.json
      - if: steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: evals/results/*_retrieval.json
      - if: steps.secret.outputs.present != 'true'
        run: echo "PINECONE_API_KEY secret not set, retrieval gate skipped"
